<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
        }
        @keyframes subtleFadeScale {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-splash {
            animation: subtleFadeScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        .loading-dot {
            animation: pulseDot 1.5s infinite ease-in-out;
        }
    </style>
</head>
<!-- Suppressing navigation as this is a splash/onboarding screen -->
<body class="bg-gradient-to-b from-primary-fixed-dim/20 via-surface-container-lowest to-surface-container-lowest min-h-screen flex items-center justify-center p-container-margin overflow-hidden font-display-lg text-on-surface">
<main class="flex flex-col items-center justify-center w-full max-w-sm mx-auto animate-splash">
<!-- Logo Container with subtle depth -->
<div class="relative w-48 h-48 md:w-56 md:h-56 mb-lg flex items-center justify-center rounded-full bg-surface-container-lowest shadow-[0px_12px_32px_rgba(14,165,165,0.08)]">
<img alt="LocalLink Brand Logo" class="w-full h-full object-contain p-md rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqqna1mJBUw3L-REqpbnI8uEX-Q5cvxKRsf2GsNqu0TgkLAnJhKluOVFp-Y4IqyfMvfhuvhg3RWw57dvlURtu1IE_nCXPk-K-vS4hdJsHMZpK3cqRdrxWpqmRSPnPOO9EJ92rFbFcVOcgNBuch16kGHJg5fT8ZtlHh6jGxzGdBrGB8v-tjj1SaQi0QAVgaHKcJHRD5hX31EEMU3h438AuyLskwJXzXjoMt7eXTJwbMu_Do4wD8vKApKg"/>
<!-- Decorative concentric ring -->
<div class="absolute inset-0 rounded-full border border-primary-fixed-dim/30 scale-110 pointer-events-none opacity-50"></div>
</div>
<!-- App Name -->
<h1 class="font-display-lg text-display-lg text-primary text-center tracking-tight mb-sm">
            LocalLink
        </h1>
<!-- Tagline / Subtext -->
<p class="font-body-lg text-body-lg text-on-surface-variant text-center opacity-80 max-w-[250px]">
            Your neighborhood, connected.
        </p>
<!-- Minimal Loading Indicator -->
<div class="absolute bottom-16 left-1/2 transform -translate-x-1/2 flex space-x-2">
<div class="w-2 h-2 rounded-full bg-primary loading-dot" style="animation-delay: 0s;"></div>
<div class="w-2 h-2 rounded-full bg-primary loading-dot" style="animation-delay: 0.2s;"></div>
<div class="w-2 h-2 rounded-full bg-primary loading-dot" style="animation-delay: 0.4s;"></div>
</div>
</main>
<!-- Interactive script to transition out (simulation for presentation) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.8s ease-in-out';
                document.body.style.opacity = '0';
                // In a real app, this would route to the Home screen
            }, 3000);
        });
    </script>
</body></html>
