<style>
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar (Transactional, no nav elements) -->
<header class="w-full top-0 flex items-center px-container-margin h-16 max-w-7xl mx-auto bg-background">
<button class="text-on-surface-variant hover:bg-secondary-container transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-container-margin max-w-md mx-auto w-full pb-xl">
<div class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Verify your number</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the 6-digit code sent to <span class="font-medium text-on-surface">+1 234 567 8900</span></p>
</div>
<div class="mb-lg">
<div class="flex justify-between gap-base mb-md" id="otp-container">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md bg-[#F1F5F9] border-none rounded-lg focus:ring-0 focus:bg-white focus:outline focus:outline-2 focus:outline-primary transition-all text-on-surface shadow-[0px_4px_20px_rgba(0,0,0,0.04)]" maxlength="1" pattern="\d*" type="number"/>
</div>
<div class="text-center">
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors active:scale-95 duration-150 inline-block p-2 rounded-md hover:bg-surface-container-low">Resend code</button>
</div>
</div>
<div class="mt-auto md:mt-lg">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-[0px_12px_32px_rgba(14,165,165,0.1)] hover:bg-primary-fixed-dim transition-colors active:scale-95 duration-200">
                Verify
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            
            // Focus first input on load
            if(inputs.length > 0) {
                inputs[0].focus();
            }
        });
    </script>
</body></html>
