<script>
        // Scroll effect for top nav
        const topNav = document.getElementById('top-nav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                topNav.classList.add('bg-surface/90', 'backdrop-blur-md', 'shadow-sm');
                topNav.classList.remove('bg-transparent');
            } else {
                topNav.classList.remove('bg-surface/90', 'backdrop-blur-md', 'shadow-sm');
                topNav.classList.add('bg-transparent');
            }
        });
    </script>
