<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Create Activity Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-tertiary-fixed": "#341100",
                    "background": "#f8f9ff",
                    "on-primary-fixed-variant": "#004f50",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#511e00",
                    "on-surface-variant": "#3d4949",
                    "tertiary-fixed": "#ffdbcb",

<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .input-base {
            @apply w-full bg-[#F1F5F9] border-none rounded-lg py-3 px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary-container transition-all;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-background flex items-center px-container-margin h-16 max-w-7xl mx-auto shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-secondary-container transition-colors active:scale-95 duration-150 p-2 rounded-full mr-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary truncate flex-1">Create Post</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-container-margin py-md space-y-lg overflow-y-auto pb-32">
<!-- Activity Type Chips -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Activity Type</h2>
<div class="flex overflow-x-auto no-scrollbar space-x-base pb-2">
<button class="flex-shrink-0 bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-2 rounded-full">Sports</button>
<button class="flex-shrink-0 bg-secondary-container text-primary font-label-md text-label-md px-4 py-2 rounded-full">Study</button>
<button class="flex-shrink-0 bg-secondary-container text-primary font-label-md text-label-md px-4 py-2 rounded-full">Hangout</button>
<button class="flex-shrink-0 bg-secondary-container text-primary font-label-md text-label-md px-4 py-2 rounded-full">Fitness</button>
<button class="flex-shrink-0 bg-secondary-container text-primary font-label-md text-label-md px-4 py-2 rounded-full">Help</button>
<button class="flex-shrink-0 bg-secondary-container text-primary font-label-md text-label-md px-4 py-2 rounded-full">Other</button>
</div>
</section>
<!-- Title Input -->
<section class="space-y-xs">
<label class="sr-only" for="post-title">Title</label>
<input class="input-base font-headline-md text-headline-md py-4" id="post-title" placeholder="What are you planning?" type="text"/>
</section>
<!-- Date & Time Row -->
<section class="flex space-x-gutter">
<div class="flex-1 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">calendar_month</span>
<input class="input-base pl-10" placeholder="Date" type="text"/>
</div>
<div class="flex-1 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">schedule</span>
<input class="input-base pl-10" placeholder="Time" type="text"/>
</div>
</section>
<!-- Location Preview -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Location</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] p-4 flex items-center space-x-4 cursor-pointer active:scale-[0.98] transition-transform">
<div class="w-12 h-12 bg-surface-variant rounded-lg flex items-center justify-center relative overflow-hidden">
<div class="bg-cover bg-center absolute inset-0 opacity-50" data-alt="A detailed, clean, high-contrast digital map interface showing a generic neighborhood layout with subtle pastel colored blocks and light gray roads in a modern light mode aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCJ7qFqRiGcnn86sq6aVPE2nt9Q_oQdl-O7koFMecTYwJDq6BRSftBTDMjWEYsgREMjX5CRm6VWaHBzZBTlSvQl8J9lQLAclqKGpeMCKkVyt2WEcKRk3wl5EgJCF3-MWAAZARtZkuC23-ZXZNxpWTWejJz0ml8NttfrfvIsBQykHnG4cw7NValAXExBHw_RL0IUXWZb_ArxICZhWiaqhrNH_2qw6R5dksXP6grGpxMvym4-xv_9fTspJQ')"></div>
<span class="material-symbols-outlined text-primary-container z-10" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface">Select on map</p>
<p class="font-label-sm text-label-sm text-outline">Help neighbors find you</p>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</section>
<!-- Description Textarea -->
<section class="space-y-xs">
<label class="sr-only" for="post-desc">Description</label>
<textarea class="input-base resize-none" id="post-desc" placeholder="Tell your neighbors more about it..." rows="4"></textarea>
</section>
<!-- Photo Upload -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Photos</h2>
<div class="w-24 h-24 border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center bg-surface-container text-primary cursor-pointer hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-sm text-label-sm mt-1">Add Photo</span>
</div>
</section>
</main>
<!-- Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-background/80 backdrop-blur-md pb-safe">
<button class="w-full bg-primary-container text-on-error font-headline-md text-[20px] py-4 rounded-xl shadow-[0px_12px_32px_rgba(14,165,165,0.2)] active:scale-[0.98] transition-all">
            Post
        </button>
</div>
</body></html>
